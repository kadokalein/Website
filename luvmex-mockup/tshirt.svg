<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380">
  <!-- Studio background -->
  <rect width="300" height="380" fill="#141414"/>

  <!-- Subtle top vignette for realism -->
  <defs>
    <radialGradient id="vign" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#464543"/>
      <stop offset="100%" stop-color="#2c2b29"/>
    </radialGradient>
    <filter id="softedge" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Main shirt body + sleeves (charcoal, boxy) -->
  <path fill="url(#vign)"
    d="M 5,52 L 58,28 L 105,22 Q 150,57 195,22 L 242,28 L 295,52
       L 295,90 L 248,76 L 248,295 L 52,295 L 52,76 L 5,90 Z"/>

  <!-- Collar inner shadow (depth) -->
  <path fill="#1a1917"
    d="M 105,22 Q 150,57 195,22 Q 172,52 150,57 Q 128,52 105,22 Z"/>

  <!-- Left armhole shadow -->
  <path fill="#1e1d1b" opacity="0.65"
    d="M 58,28 L 52,76 L 64,76 L 68,31 Z"/>
  <!-- Right armhole shadow -->
  <path fill="#1e1d1b" opacity="0.65"
    d="M 242,28 L 248,76 L 236,76 L 232,31 Z"/>

  <!-- Left side body shadow -->
  <rect x="52" y="76" width="14" height="219" fill="#1e1d1b" opacity="0.25"/>
  <!-- Right side body shadow -->
  <rect x="234" y="76" width="14" height="219" fill="#1e1d1b" opacity="0.25"/>

  <!-- Bottom hem shadow before strips -->
  <rect x="52" y="280" width="196" height="15" fill="#1e1d1b" opacity="0.3"/>

  <!-- ── Chest graphic ── -->
  <!-- White bold brand text -->
  <text x="150" y="148"
    text-anchor="middle"
    font-family="Impact, 'Arial Narrow', Arial Black, sans-serif"
    font-size="21" font-weight="900" letter-spacing="3"
    fill="#f0ece6">PROMETHEA</text>

  <!-- Gold barcode strip (like in photo) -->
  <rect x="82" y="160" width="136" height="12" rx="1" fill="#c8a96e"/>
  <!-- Barcode vertical marks -->
  <rect x="91"  y="160" width="2" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="98"  y="160" width="1" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="104" y="160" width="3" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="112" y="160" width="1" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="117" y="160" width="2" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="123" y="160" width="4" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="131" y="160" width="1" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="136" y="160" width="2" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="142" y="160" width="3" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="148" y="160" width="2" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="154" y="160" width="4" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="162" y="160" width="1" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="167" y="160" width="2" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="172" y="160" width="3" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="179" y="160" width="1" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="184" y="160" width="2" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="190" y="160" width="4" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="199" y="160" width="1" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="204" y="160" width="2" height="12" fill="#3a3836" opacity="0.65"/>
  <rect x="210" y="160" width="1" height="12" fill="#3a3836" opacity="0.65"/>

  <!-- ── Distressed raw-cut hem strips ── -->
  <rect x="52"  y="292" width="5" height="32" rx="2" fill="#373634"/>
  <rect x="62"  y="292" width="3" height="52" rx="2" fill="#343230"/>
  <rect x="70"  y="290" width="6" height="40" rx="2" fill="#383735"/>
  <rect x="81"  y="292" width="4" height="60" rx="2" fill="#343230"/>
  <rect x="90"  y="291" width="5" height="28" rx="2" fill="#373634"/>
  <rect x="100" y="292" width="3" height="46" rx="2" fill="#353432"/>
  <rect x="108" y="290" width="7" height="36" rx="2" fill="#383735"/>
  <rect x="120" y="292" width="4" height="56" rx="2" fill="#343230"/>

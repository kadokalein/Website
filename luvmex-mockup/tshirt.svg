  <rect x="148" y="290" width="6" height="40" rx="2" fill="#383735"/>
  <rect x="159" y="292" width="4" height="64" rx="2" fill="#323130"/>
  <rect x="169" y="291" width="5" height="30" rx="2" fill="#373634"/>
  <rect x="180" y="292" width="3" height="46" rx="2" fill="#353432"/>
  <rect x="188" y="290" width="7" height="42" rx="2" fill="#383735"/>
  <rect x="200" y="292" width="4" height="54" rx="2" fill="#343230"/>
  <rect x="210" y="291" width="5" height="28" rx="2" fill="#373634"/>
  <rect x="220" y="292" width="3" height="44" rx="2" fill="#353432"/>
  <rect x="228" y="290" width="6" height="36" rx="2" fill="#383735"/>
  <rect x="239" y="292" width="4" height="58" rx="2" fill="#343230"/>
  <rect x="247" y="291" width="4" height="30" rx="2" fill="#373634"/>
</svg>

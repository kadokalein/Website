<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380">
  <!-- Dark studio background -->
  <rect width="300" height="380" fill="#141414"/>

  <defs>
    <linearGradient id="dsg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#484644"/>
      <stop offset="45%"  stop-color="#3d3c3a"/>
      <stop offset="100%" stop-color="#2e2d2b"/>
    </linearGradient>
  </defs>

  <!-- Charcoal shirt body + sleeves -->
  <path fill="url(#dsg)"
    d="M 5,52 L 58,28 L 105,22 Q 150,57 195,22 L 242,28 L 295,52
       L 295,90 L 248,76 L 248,295 L 52,295 L 52,76 L 5,90 Z"/>

  <!-- Collar inner shadow -->
  <path fill="#1e1d1c"
    d="M 105,22 Q 150,57 195,22 Q 172,52 150,57 Q 128,52 105,22 Z"/>

  <!-- Armhole shadows -->
  <path fill="#232221" opacity="0.65" d="M 58,28 L 52,76 L 64,76 L 68,31 Z"/>
  <path fill="#232221" opacity="0.65" d="M 242,28 L 248,76 L 236,76 L 232,31 Z"/>

  <!-- Side body shadows -->
  <rect x="52"  y="76" width="14" height="219" fill="#1e1d1c" opacity="0.28"/>
  <rect x="234" y="76" width="14" height="219" fill="#1e1d1c" opacity="0.28"/>
  <rect x="52"  y="278" width="196" height="17" fill="#1e1d1c" opacity="0.3"/>

